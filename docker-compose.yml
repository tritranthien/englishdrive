services:
  transcription:
    build:
      context: .
      dockerfile: services/transcription/Dockerfile
    init: true
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
    volumes:
      - whisper_models:/models
    tmpfs:
      - /tmp/englishdrive:size=512m,uid=1000,gid=1000,mode=0700
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: english_drive
      POSTGRES_USER: english_drive
      POSTGRES_PASSWORD: english_drive
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U english_drive -d english_drive']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  whisper_models:
  postgres_data:
